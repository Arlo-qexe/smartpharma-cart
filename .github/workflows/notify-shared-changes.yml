name: Notificar cambios en shared/

# Se dispara cada vez que un push toca el contrato de comunicación (shared/) o su
# changelog. Avisa al grupo de Telegram del equipo para que ambos agentes
# (orange-pi y pc) sepan que deben hacer `git pull` antes de seguir trabajando en
# código que dependa de ese contrato.
#
# Setup requerido (una sola vez): ver docs/TELEGRAM_SETUP.md para crear el bot,
# el grupo, y agregar TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID como GitHub Secrets
# (Settings -> Secrets and variables -> Actions, en este repositorio).

on:
  push:
    branches: ["**"]
    paths:
      - "shared/**"
      - "docs/CHANGELOG_protocolo.md"

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enviar aviso a Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: bash scripts/notify_telegram.sh
